<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B5FA8" />
  <title>Preview Splash VemAprovar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
    body { min-height: 100dvh; background: #f8fbff; }
    .app { min-height: 100dvh; display: grid; place-items: center; color: #073a78; text-align: center; padding: 24px; }
    .app button { border: 0; border-radius: 999px; padding: 14px 24px; background: linear-gradient(90deg,#0962b7,#1994dc); color: white; font-weight: 800; cursor: pointer; box-shadow: 0 10px 28px rgba(8,95,170,.22); }
    .splash { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; overflow: hidden; isolation: isolate; background: radial-gradient(circle at 50% 42%,rgba(255,255,255,.98) 0 22%,rgba(255,255,255,.75) 42%,transparent 66%),linear-gradient(145deg,#e7f3ff 0%,#fbfdff 38%,#f6fbff 61%,#d9ecff 100%); transition: opacity .42s ease, visibility .42s ease; }
    .splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; }
    .orb.top { top:-24vw; left:-24vw; width:min(86vw,760px); aspect-ratio:1; background:linear-gradient(145deg,rgba(205,230,255,.82),rgba(255,255,255,.18)); }
    .orb.bottom { right:-30vw; bottom:-34vw; width:min(102vw,940px); aspect-ratio:1; background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(151,202,251,.42)); }
    .grid { position:absolute; width:116px; height:116px; opacity:.44; background-image:radial-gradient(circle,rgba(255,255,255,.92) 2px,transparent 2.4px); background-size:18px 18px; }
    .grid.top { top:24px; right:18px; } .grid.bottom { bottom:70px; left:4px; }
    .content { position:relative; z-index:3; width:min(86vw,560px); display:flex; flex-direction:column; align-items:center; transform:translateY(-1.5vh); }
    .logo { width:min(80vw,480px); height:auto; filter:drop-shadow(0 18px 30px rgba(2,70,136,.10)); animation:logoIn .9s cubic-bezier(.2,.85,.28,1) both; }
    .loading { width:min(56vw,245px); margin-top:clamp(30px,4.5vh,54px); display:flex; flex-direction:column; align-items:center; animation:loadIn .7s .26s ease both; }
    .track { position:relative; width:100%; height:4px; overflow:hidden; border-radius:999px; background:rgba(15,105,184,.13); }
    .progress { position:absolute; inset:0 auto 0 0; width:58%; border-radius:inherit; background:linear-gradient(90deg,#075eae,#1994dc,#68bff1); box-shadow:0 0 16px rgba(18,132,214,.48); animation:progress 1.45s cubic-bezier(.65,0,.35,1) infinite; }
    .message { margin:14px 0 0; color:rgba(7,58,120,.72); font-size:.82rem; font-weight:650; }
    .dots { display:flex; gap:7px; margin-top:15px; } .dots i { width:6px; height:6px; border-radius:50%; background:#0b76cb; animation:dot 1.15s ease-in-out infinite; } .dots i:nth-child(2){animation-delay:.14s}.dots i:nth-child(3){animation-delay:.28s}
    .footer { position:absolute; z-index:3; left:50%; bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px)); transform:translateX(-50%); width:max-content; margin:0; color:rgba(8,75,145,.42); font-size:.64rem; font-weight:800; letter-spacing:.22em; }
    @keyframes logoIn { from { opacity:0; transform:translateY(18px) scale(.94); filter:blur(8px); } to { opacity:1; transform:none; filter:blur(0) drop-shadow(0 18px 30px rgba(2,70,136,.10)); } }
    @keyframes loadIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @keyframes progress { 0%{transform:translateX(-102%) scaleX(.7)} 48%{transform:translateX(70%) scaleX(1)} 100%{transform:translateX(182%) scaleX(.74)} }
    @keyframes dot { 0%,70%,100%{opacity:.28;transform:scale(.82)}35%{opacity:1;transform:scale(1)} }
  </style>
</head>
<body>
  <main class="app">
    <div>
      <h1>Splash pronta</h1>
      <p>Visualização local da abertura do VemAprovar.</p>
      <button id="replay">Reproduzir novamente</button>
    </div>
  </main>

  <section class="splash" id="splash" aria-label="VemAprovar está carregando">
    <div class="orb top"></div><div class="orb bottom"></div>
    <div class="grid top"></div><div class="grid bottom"></div>
    <div class="content">
      <img class="logo" src="./vemaprovar-logo-completa.png" alt="VemAprovar — Seu plano, sua aprovação" />
      <div class="loading">
        <div class="track"><span class="progress"></span></div>
        <p class="message">Preparando sua aprovação...</p>
        <div class="dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <p class="footer">ESTUDE COM ESTRATÉGIA</p>
  </section>

  <script>
    const splash = document.querySelector('#splash');
    const replay = document.querySelector('#replay');
    const play = () => {
      splash.classList.remove('hide');
      window.setTimeout(() => splash.classList.add('hide'), 2400);
    };
    replay.addEventListener('click', play);
    play();
  </script>
</body>
</html>
